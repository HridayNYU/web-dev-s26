<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IDM Hub | Teams</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <canvas id="bgCanvas"></canvas>
    <header class="top">
      <div class="logo-area">
        <img
          src="images/NYU-Logo-768x432.png"
          alt="NYU logo"
          class="logo-img"
        />
        <div class="site-name">IDM Hub</div>
      </div>

      <nav class="nav">
        <a href="Index.html">Home</a>
        <a href="teams.html" class="active">Teams</a>
        <a href="alumni.html">Alumni</a>
      </nav>

      <div class="top-right">
        <a href="myprofile.html">
          <img
            src="images/cropped.jpg"
            alt="Profile picture"
            class="nav-profile-pic"
          />
        </a>
      </div>
    </header>

    <main class="container">
      <section class="hero">
        <h1>Teams</h1>
        <p>
          Find classmates to collaborate with on projects, assignments, and
          events.
        </p>
      </section>

      <section class="section team-top-row">
        <div class="filter-row">
          <button class="filter-box" onclick="filterProjects('All')">
            All
          </button>
          <button class="filter-box" onclick="filterProjects('UX')">UX</button>
          <button class="filter-box" onclick="filterProjects('3D')">3D</button>
          <button class="filter-box" onclick="filterProjects('Web')">
            Web
          </button>
          <button class="filter-box" onclick="filterProjects('Creative Tech')">
            Creative Tech
          </button>
        </div>

        <button class="btn small-btn" onclick="openProjectForm()">
          + Add New Project
        </button>
      </section>

      <section class="section">
        <div id="projectList" class="list-box"></div>
      </section>
    </main>

    <div id="projectModal" class="modal hidden">
      <div class="modal-box">
        <div class="modal-header">
          <h2>Add New Project</h2>
          <button onclick="closeProjectForm()" class="close-btn">×</button>
        </div>

        <label>Project Title</label>
        <input id="projectTitleInput" type="text" />

        <label>Category</label>
        <select id="projectCategoryInput">
          <option>UX</option>
          <option>3D</option>
          <option>Web</option>
          <option>Creative Tech</option>
        </select>

        <label>Description</label>
        <textarea id="projectDescriptionInput"></textarea>

        <label>Skills Needed</label>
        <input id="projectSkillsInput" type="text" />

        <label>Posted By</label>
        <input id="projectAuthorInput" type="text" />

        <div class="modal-actions">
          <button onclick="closeProjectForm()" class="btn outline small-btn">
            Cancel
          </button>
          <button onclick="addProject()" class="btn small-btn">
            Submit Project
          </button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
