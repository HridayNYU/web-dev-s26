<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Elevator Scrolling Example</title>

    <style type="text/css" media="screen">
      body {
        font-family: Arial, Helvetica, sans-serif;
        color: aliceblue;
        background-color: black;
        margin: 0;
      }

      #main {
        margin: 0 auto;
        width: 800px;
      }

      section {
        padding: 20px 0 80px 0;
        height: 100vh;
      }

      section h2 {
        font-size: 48px;
        border-bottom: 2px solid #ccc;
        padding-bottom: 20px;
      }

      ul {
        position: fixed;
        top: 40%;
        right: 0;
        list-style-type: none;
        padding-left: 0;
        margin: 0;
      }

      li {
        width: 30px;
        padding: 10px;
        margin-bottom: 1px;
        color: #ccc;
        border-left: 10px solid #ccc;
        cursor: pointer;
        transition: all 0.5s;
      }

      .active,
      li:hover {
        color: #fff;
        border-left: 20px solid #fff;
        line-height: 30px;
      }
    </style>
  </head>

  <body>
    <!-- elevator buttons -->
    <ul>
      <li id="floor5Btn">5</li>
      <li id="floor4Btn">4</li>
      <li id="floor3Btn">3</li>
      <li id="floor2Btn">2</li>
      <li id="floor1Btn">1</li>
    </ul>

    <!-- floors -->
    <div id="main">
      <section id="floor5Panel">
        <h2>Floor 5</h2>
      </section>

      <section id="floor4Panel">
        <h2>Floor 4</h2>
      </section>

      <section id="floor3Panel">
        <h2>Floor 3</h2>
      </section>

      <section id="floor2Panel">
        <h2>Floor 2</h2>
      </section>

      <section id="floor1Panel">
        <h2>Floor 1</h2>
      </section>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/ScrollToPlugin.min.js"></script>

    <script type="text/javascript">
      // WE DON'T HAVE TO REGISTER PLUGIN SINCE WE LOADED THE SCRIPT FOR SCROLLTO_PLUGIN MANUALLY

      document.addEventListener("DOMContentLoaded", () => {
        gsap.from("body", 1, { opacity: 0 });
        gsap.from("ul", 1, { right: -500, delay: 0.5 });

        const floor1Btn = document.getElementById("floor1Btn");
        const floor2Btn = document.getElementById("floor2Btn");
        const floor3Btn = document.getElementById("floor3Btn");
        const floor4Btn = document.getElementById("floor4Btn");
        const floor5Btn = document.getElementById("floor5Btn");

        // THIS is what your prof is doing
        let navButtons = [];
        navButtons = [].slice.call(document.getElementsByTagName("li"));

        floor5Btn.onclick = function () {
          navButtons.forEach((b) => b.classList.remove("active"));
          floor5Btn.classList.add("active");

          gsap.to(window, {
            duration: 1,
            scrollTo: "#floor5Panel",
          });
        };

        floor4Btn.onclick = function () {
          navButtons.forEach((b) => b.classList.remove("active"));
          floor4Btn.classList.add("active");

          gsap.to(window, {
            duration: 1,
            scrollTo: "#floor4Panel",
          });
        };

        floor3Btn.onclick = function () {
          navButtons.forEach((b) => b.classList.remove("active"));
          floor3Btn.classList.add("active");

          gsap.to(window, {
            duration: 1,
            scrollTo: "#floor3Panel",
          });
        };

        floor2Btn.onclick = function () {
          navButtons.forEach((b) => b.classList.remove("active"));
          floor2Btn.classList.add("active");

          gsap.to(window, {
            duration: 1,
            scrollTo: "#floor2Panel",
          });
        };

        floor1Btn.onclick = function () {
          navButtons.forEach((b) => b.classList.remove("active"));
          floor1Btn.classList.add("active");

          gsap.to(window, {
            duration: 1,
            scrollTo: "#floor1Panel",
          });
        };
      });
    </script>
  </body>
</html>
