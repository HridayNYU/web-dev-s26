<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS Object vs JSON</title>
  </head>
  <body>
    <script>
      const customer = {
        name: "Tony",
        age: 23,
        married: false,
        pets: ["dog", "cat", "iguana"],
        siblings: [
          { name: "Sally", age: 34, married: true },
          { name: "Billy", age: 16, married: false },
        ],
      };

      console.log(customer.age);

      for (let i = 0; i < customer.pets.length; i++) {
        console.log(customer.pets[i]);
      }

      console.log(customer.siblings[0].married);

      console.log(customer.pets[2]);

      console.log(customer);

      const customerJSON = JSON.stringify(customer);
      console.log(customerJSON);

      const customerObj = JSON.parse(customerJSON);
      console.log(customerObj);

      const logApiResults = async () => {
        const response = await fetch("https://rickandmortyapi.com/api/character/1");
        const result = await response.json();
        console.log(result);
        return result;
      };

      logApiResults()
        .then((data) => {
          const message = `${data.name} is a ${data.species} from ${data.origin.name} and they are ${data.status}`;
          console.log(message);
        })
        .catch((error) => {
          console.error(error);
        });
    </script>
  </body>
</html>
